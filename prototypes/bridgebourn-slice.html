<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>豚豚生存者 · 2.5D 战斗切片</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172817;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:fixed;inset:14px 16px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 0 #26351d,0 0 6px #000}
  .panel{padding:8px 12px;background:rgba(28,43,24,.78);border:2px solid #e8d28a;box-shadow:inset 0 0 0 2px #5f6e3f,0 5px 0 rgba(19,30,17,.45)}
  #title{font-weight:950;letter-spacing:.08em;color:#fff2b0}#stats{font:700 12px/1.45 ui-monospace,monospace;text-align:right;color:#e9ffd0}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:7px 12px;background:rgba(24,36,20,.78);border:2px solid #cfbd78;font-size:12px;pointer-events:none}
  .stick,.action{position:fixed;display:none;border:2px solid rgba(255,245,184,.65);background:rgba(35,53,29,.35);backdrop-filter:blur(2px)}
  .stick{left:24px;bottom:25px;width:112px;height:112px;border-radius:50%}.knob{position:absolute;left:34px;top:34px;width:40px;height:40px;border-radius:50%;background:rgba(255,238,154,.6);border:2px solid rgba(38,57,31,.75)}
  .action{right:28px;bottom:37px;width:78px;height:78px;border-radius:50%;color:#fff4b2;font-size:27px;font-weight:900}.action small{display:block;font-size:9px}
  @media(pointer:coarse),(max-width:920px){.stick,.action{display:block}#hint{display:none}#hud{inset:7px 8px auto}.panel{padding:5px 8px;font-size:11px}#stats{font-size:9px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="panel"><div id="title">豚豚生存者 · 2.5D LAB</div><div id="bossText">空间切片验证</div></div><div class="panel" id="stats"></div></div>
<div id="hint">WASD / 方向键移动　·　空格尖叫　·　B 立即召唤螳螂　·　R 重开</div>
<div class="stick" id="stick"><i class="knob"></i></div><button class="action" id="action">📣<small>尖叫</small></button>
<script>
"use strict";
const canvas=document.querySelector("#game"),ctx=canvas.getContext("2d",{alpha:false}),statsEl=document.querySelector("#stats"),bossText=document.querySelector("#bossText");
const DPR=Math.min(2,devicePixelRatio||1),keys=new Set(),TAU=Math.PI*2;
let W=960,H=540,last=performance.now(),time=0,freeze=0,flash=0,shake=0,kills=0,bossSpawned=false,nextId=1,fps=60,fpsClock=0,fpsFrames=0;
const view={x:0,y:0,vx:0,vy:0,zoom:1,impactX:0,impactY:0};
const player={x:0,y:80,z:0,vx:0,vy:0,r:18,hp:120,maxHp:120,speed:178,facing:1,walk:0,fire:0,skill:0,inv:0,hit:0};
const actors=[],shots=[],particles=[],texts=[],decal=[];
const images={};
const assets={
  nugget:"../assets/sprites/idle/nugget.png",fork:"../assets/sprites/idle/mouse-fork.png",bomb:"../assets/sprites/idle/bomb-mouse.png",
  bully:"../assets/sprites/idle/bully-mouse.png",bat:"../assets/sprites/idle/bat.png",frog:"../assets/sprites/idle/frog.png",
  snail:"../assets/sprites/idle/fortress-snail.png",mantis:"../assets/sprites/bosses/mantis.png",ground:"../assets/retro32/backgrounds/battle-meadow-256.png",
  carrot:"../assets/sprites/projectiles/carrot.png"
};
for(const [k,src] of Object.entries(assets)){const im=new Image();im.src=src;images[k]=im;}
function resize(){W=Math.max(640,Math.floor(innerWidth*DPR));H=Math.max(360,Math.floor(innerHeight*DPR));canvas.width=W;canvas.height=H;ctx.imageSmoothingEnabled=false;}
addEventListener("resize",resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=(a,b)=>a+Math.random()*(b-a);
function worldToScreen(x,y,z=0){const depth=clamp(1+(y-view.y)*.00014,.9,1.12),zoom=view.zoom*DPR*depth;return{x:(x-view.x)*zoom+W/2+view.impactX,y:(y-view.y)*zoom*.64+H*.57-z*zoom+view.impactY,s:zoom};}
function terrainHeight(x,y){return Math.sin(x*.0022)*4+Math.sin(y*.0031+1.1)*3;}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fill();}
function spawn(type,x,y,extra={}){const defs={
  fork:{hp:46,speed:54,r:19,size:70,mode:"pursue"},bomb:{hp:62,speed:48,r:21,size:88,mode:"bomb"},bully:{hp:210,speed:55,r:29,size:98,mode:"charge"},
  bat:{hp:27,speed:145,r:14,size:62,mode:"sweep"},frog:{hp:88,speed:48,r:22,size:78,mode:"jump"},snail:{hp:270,speed:25,r:28,size:94,mode:"guard"},
  mantis:{hp:3400,speed:48,r:62,size:230,mode:"boss"}
},d=defs[type];actors.push({id:nextId++,type,x,y,z:0,vx:0,vy:0,kx:0,ky:0,hp:d.hp,maxHp:d.hp,speed:d.speed,r:d.r,size:d.size,mode:d.mode,facing:1,walk:rnd(0,8),timer:rnd(.5,2),state:"move",hit:0,dead:false,...extra});}
function reset(){actors.length=shots.length=particles.length=texts.length=decal.length=0;Object.assign(player,{x:0,y:80,z:0,vx:0,vy:0,hp:120,fire:0,skill:0,inv:0});time=kills=0;bossSpawned=false;view.x=0;view.y=80;
  for(let i=0;i<18;i++){const type=["fork","fork","bomb","bully","frog","snail"][i%6],a=i/18*TAU,r=280+(i%3)*90;spawn(type,Math.cos(a)*r,80+Math.sin(a)*r);}
  spawnBatWave(-420,-100);spawnBatWave(460,230,true);
}
function spawnBatWave(x,y,reverse=false){for(let i=0;i<5;i++)spawn("bat",x+(reverse?1:-1)*i*22,y+(i-2)*38,{laneY:y+(i-2)*38,sweepDir:reverse?-1:1});}
reset();
function nearest(){let best=null,bd=1e9;for(const e of actors){if(e.dead)continue;const d=dist(player,e);if(d<bd){bd=d;best=e;}}return best;}
function fire(){const t=nearest();if(!t)return;const a=Math.atan2(t.y-player.y,t.x-player.x);player.facing=Math.cos(a)<0?-1:1;shots.push({x:player.x,y:player.y,z:26,vx:Math.cos(a)*440,vy:Math.sin(a)*440,r:8,life:1.8,rot:a});player.fire=.42;for(let i=0;i<4;i++)spark(player.x+Math.cos(a)*18,player.y+Math.sin(a)*18,24,"#ffd468",a+Math.PI);}
function spark(x,y,count,color,base=null){for(let i=0;i<count;i++){const a=base==null?Math.random()*TAU:base+rnd(-.65,.65),sp=rnd(35,190);particles.push({x,y,z:rnd(5,34),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:rnd(25,150),life:rnd(.22,.55),max:.55,r:rnd(2,5),color});}}
function hurtEnemy(e,dmg,ang){e.hp-=dmg;e.hit=.12;e.kx+=Math.cos(ang)*(e.type==="mantis"?45:150);e.ky+=Math.sin(ang)*(e.type==="mantis"?45:150);freeze=Math.max(freeze,e.type==="mantis"?.018:.028);shake=Math.max(shake,e.type==="mantis"?4:7);flash=Math.max(flash,.055);view.impactX+=Math.cos(ang)*-5*DPR;view.impactY+=Math.sin(ang)*-3*DPR;spark(e.x,e.y,8,e.type==="mantis"?"#d7ff6b":"#ffd06a",ang+Math.PI);texts.push({x:e.x,y:e.y,z:e.r+25,text:"-"+dmg,life:.55});if(e.hp<=0){e.dead=true;kills++;spark(e.x,e.y,18,"#ffb45c");shake=Math.max(shake,10);}}
function hurtPlayer(dmg){if(player.inv>0)return;player.hp=Math.max(0,player.hp-dmg);player.inv=.65;shake=12;flash=.18;texts.push({x:player.x,y:player.y,z:55,text:"-"+dmg,life:.8,red:true});if(player.hp<=0)reset();}
function scream(){if(player.skill>0)return;player.skill=5.5;shake=8;flash=.1;for(const e of actors){const d=dist(player,e);if(d<175){const a=Math.atan2(e.y-player.y,e.x-player.x);e.kx+=Math.cos(a)*(e.type==="mantis"?130:420);e.ky+=Math.sin(a)*(e.type==="mantis"?130:420);if(e.type!=="mantis")hurtEnemy(e,16,a);}}decal.push({x:player.x,y:player.y,r:12,maxR:185,life:.5,max:.5,color:"#c8fff1"});}
function update(dt){time+=dt;player.fire=Math.max(0,player.fire-dt);player.skill=Math.max(0,player.skill-dt);player.inv=Math.max(0,player.inv-dt);
  let dx=(keys.has("d")||keys.has("arrowright")?1:0)-(keys.has("a")||keys.has("arrowleft")?1:0),dy=(keys.has("s")||keys.has("arrowdown")?1:0)-(keys.has("w")||keys.has("arrowup")?1:0);dx+=stickVector.x;dy+=stickVector.y;const l=Math.hypot(dx,dy);if(l){dx/=Math.max(1,l);dy/=Math.max(1,l);player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt;player.walk+=dt*10;if(Math.abs(dx)>.08)player.facing=dx<0?-1:1;}else player.walk+=dt*2;
  player.z=terrainHeight(player.x,player.y)+(l?Math.abs(Math.sin(player.walk))*2:Math.sin(time*3)*1.2);if(player.fire<=0)fire();
  if(!bossSpawned&&time>22){bossSpawned=true;spawn("mantis",player.x+430,player.y-280);bossText.textContent="⚠ 巨型螳螂：近战技能循环";}
  for(const e of actors){if(e.dead)continue;e.hit=Math.max(0,e.hit-dt);e.timer-=dt;e.walk+=dt*e.speed*.06;e.x+=e.kx*dt;e.y+=e.ky*dt;e.kx*=Math.pow(.035,dt);e.ky*=Math.pow(.035,dt);const a=Math.atan2(player.y-e.y,player.x-e.x),d=dist(player,e);e.facing=Math.cos(a)<0?-1:1;
    if(e.mode==="pursue"){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(e.timer<0&&d<190){e.state="lunge";e.timer=.65;e.kx=Math.cos(a)*270;e.ky=Math.sin(a)*270;}}
    else if(e.mode==="bomb"){if(e.state==="armed"){if(e.timer<0){decal.push({x:e.x,y:e.y,r:16,maxR:115,life:.45,max:.45,color:"#ff6b3d"});if(d<118)hurtPlayer(24);e.dead=true;shake=16;spark(e.x,e.y,30,"#ff8a38");}}else{const dir=d<145?-1:1;e.x+=Math.cos(a)*e.speed*dir*dt;e.y+=Math.sin(a)*e.speed*dir*dt;if(e.timer<0&&d<230){e.state="armed";e.timer=1.6;}}}
    else if(e.mode==="charge"){if(e.state==="warn"){if(e.timer<0){e.state="charge";e.timer=.55;e.kx=Math.cos(a)*620;e.ky=Math.sin(a)*620;}}else if(e.timer<0){e.state="warn";e.timer=.8;}else if(e.state!=="charge"){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;}}
    else if(e.mode==="sweep"){e.x+=(e.sweepDir||1)*e.speed*dt;e.y+=(e.laneY-e.y)*dt*3;if(Math.abs(e.x-player.x)>560)e.x=player.x-(e.sweepDir||1)*540;}
    else if(e.mode==="jump"){if(e.state==="air"){const p=1-e.timer/.72;e.z=Math.sin(clamp(p,0,1)*Math.PI)*92;if(e.timer<0){e.state="rest";e.timer=1.05;e.z=0;decal.push({x:e.x,y:e.y,r:8,maxR:72,life:.35,max:.35,color:"#a9db68"});shake=5;}}else{e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(e.timer<0){e.state="air";e.timer=.72;e.kx=Math.cos(a)*260;e.ky=Math.sin(a)*260;}}}
    else if(e.mode==="guard"){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(e.timer<0){e.timer=2.6;e.state="guard";decal.push({x:e.x,y:e.y,r:8,maxR:105,life:.55,max:.55,color:"#d8bd74"});if(d<108)hurtPlayer(12);}}
    else if(e.mode==="boss")updateMantis(e,dt,a,d);
    e.z=Math.max(e.z||0,terrainHeight(e.x,e.y));if(d<e.r+player.r*.72&&e.state!=="warn")hurtPlayer(e.type==="mantis"?18:e.type==="bully"?14:8);
  }
  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=dt*9;s.life-=dt;for(const e of actors){if(e.dead||s.dead)continue;if(dist(s,e)<e.r+s.r){s.dead=true;hurtEnemy(e,24,Math.atan2(s.vy,s.vx));break;}}}
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vz-=420*dt;p.life-=dt;}for(const t of texts){t.z+=25*dt;t.life-=dt;}for(const d of decal)d.life-=dt;
  for(let i=actors.length-1;i>=0;i--)if(actors[i].dead)actors.splice(i,1);for(let i=shots.length-1;i>=0;i--)if(shots[i].dead||shots[i].life<0)shots.splice(i,1);for(let i=particles.length-1;i>=0;i--)if(particles[i].life<0)particles.splice(i,1);for(let i=texts.length-1;i>=0;i--)if(texts[i].life<0)texts.splice(i,1);for(let i=decal.length-1;i>=0;i--)if(decal[i].life<0)decal.splice(i,1);
  const targetZoom=innerWidth<760?.86:1;view.zoom+=(targetZoom-view.zoom)*dt*3.5;const tx=player.x+player.vx*.1,ty=player.y-35;view.vx+=(tx-view.x)*dt*7;view.vy+=(ty-view.y)*dt*7;view.vx*=Math.pow(.001,dt);view.vy*=Math.pow(.001,dt);view.x+=view.vx*dt;view.y+=view.vy*dt;view.impactX*=Math.pow(.002,dt);view.impactY*=Math.pow(.002,dt);
}
function updateMantis(e,dt,a,d){if(e.state==="move"){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(e.timer<0){e.skill=(e.skill||0)%4;e.skill++;e.state=["slash","dashWarn","leap","spin"][e.skill-1];e.timer=[.8,.85,1.0,1.2][e.skill-1];}}
  else if(e.state==="slash"&&e.timer<.25){e.state="recover";e.timer=.7;decal.push({x:e.x,y:e.y,r:28,maxR:165,life:.3,max:.3,color:"#d9ff6f"});if(d<170)hurtPlayer(22);spark(e.x,e.y,22,"#d9ff73",a);shake=9;}
  else if(e.state==="dashWarn"&&e.timer<0){e.state="dash";e.timer=.5;e.kx=Math.cos(a)*780;e.ky=Math.sin(a)*780;decal.push({x:e.x,y:e.y,r:20,maxR:95,life:.4,max:.4,color:"#8eda50"});}
  else if(e.state==="leap"){const p=1-e.timer/1;e.z=Math.sin(clamp(p,0,1)*Math.PI)*165;if(e.timer<0){e.state="recover";e.timer=.75;e.z=0;decal.push({x:e.x,y:e.y,r:22,maxR:190,life:.55,max:.55,color:"#b1df57"});if(d<195)hurtPlayer(27);shake=18;spark(e.x,e.y,30,"#c5ef6a");}}
  else if(e.state==="spin"){e.spin=(e.spin||0)+dt*16;if(d<150&&Math.floor(e.timer*8)!==Math.floor((e.timer+dt)*8))hurtPlayer(8);if(e.timer<0){e.state="recover";e.timer=.8;}}
  else if(e.timer<0){e.state="move";e.timer=1.55;}}
function drawGround(){ctx.fillStyle="#7fb844";ctx.fillRect(0,0,W,H);const tile=images.ground,base=worldToScreen(0,0,0),tw=256*DPR*view.zoom;ctx.save();ctx.globalAlpha=.48;ctx.imageSmoothingEnabled=false;if(tile.complete&&tile.naturalWidth){for(let x=-3;x<=3;x++)for(let y=-3;y<=3;y++){const p=worldToScreen(view.x+x*256,view.y+y*256,0);ctx.drawImage(tile,p.x-tw/2,p.y-tw*.32,tw,tw*.64);}}ctx.restore();
  for(let gy=-3;gy<=3;gy++)for(let gx=-4;gx<=4;gx++){const x=Math.floor(view.x/180)*180+gx*180,y=Math.floor(view.y/150)*150+gy*150,p=worldToScreen(x,y,0),seed=Math.abs((gx*19+gy*37)%7);if(seed<3){ellipse(p.x,p.y,34*p.s,9*p.s,"rgba(66,105,42,.28)");ctx.fillStyle=seed===0?"#e9d66e":"#d7f0a0";for(let i=0;i<4;i++)ctx.fillRect(p.x+(i-2)*9*p.s,p.y-(5+i%2*4)*p.s,3*p.s,8*p.s);}}
  drawTerrace(-430,-310,260,105,28);drawTerrace(330,250,300,120,36);drawTerrace(380,-250,220,90,22);
}
function drawTerrace(x,y,w,h,height){const p=worldToScreen(x,y,0),s=p.s;ctx.fillStyle="#5b7138";ctx.beginPath();ctx.ellipse(p.x,p.y+height*s*.45,w*s*.5,h*s*.32,0,0,TAU);ctx.fill();ctx.fillStyle="#9bc955";ctx.beginPath();ctx.ellipse(p.x,p.y,w*s*.5,h*s*.32,0,0,TAU);ctx.fill();ctx.strokeStyle="#d8e77c";ctx.lineWidth=3*s;ctx.stroke();}
function drawSprite(entity,key,size,frames=4){const im=images[key],p=worldToScreen(entity.x,entity.y,entity.z||0),shadow=worldToScreen(entity.x,entity.y,0),stateScale=entity.hit>0?1.1:entity.state==="charge"?.9:1,depth=p.s*stateScale;ellipse(shadow.x+9*shadow.s,shadow.y+8*shadow.s,size*.24*shadow.s,size*.075*shadow.s,"rgba(26,34,21,.38)");if(entity.state==="warn"||entity.state==="armed"){ctx.strokeStyle=entity.state==="armed"?"#ff7045":"#ffe777";ctx.lineWidth=4*DPR;ctx.beginPath();ctx.ellipse(shadow.x,shadow.y,size*.38*shadow.s,size*.13*shadow.s,0,0,TAU);ctx.stroke();}
  ctx.save();ctx.translate(p.x,p.y);if(entity.state==="spin")ctx.rotate(entity.spin||0);ctx.scale(entity.facing||1,1);if(entity.hit>0){ctx.shadowBlur=18*DPR;ctx.shadowColor="#fff5b5";}ctx.imageSmoothingEnabled=false;if(im&&im.complete&&im.naturalWidth){const fw=im.naturalWidth/(key==="mantis"?1:frames),frame=key==="mantis"?0:Math.floor(entity.walk)%frames;ctx.drawImage(im,frame*fw,0,fw,im.naturalHeight,-size*depth/2,-size*depth,size*depth,size*depth);}else{ellipse(0,-size*.45*depth,size*.28*depth,size*.32*depth,"#e9d18d");}ctx.restore();}
function drawPlayer(){drawSprite(player,"nugget",96,4);const p=worldToScreen(player.x,player.y,player.z);ctx.fillStyle="#fff";ctx.fillRect(p.x-42*DPR,p.y+14*DPR,84*DPR,6*DPR);ctx.fillStyle="#ef5c54";ctx.fillRect(p.x-40*DPR,p.y+16*DPR,80*DPR*player.hp/player.maxHp,2*DPR);}
function drawShot(s){const p=worldToScreen(s.x,s.y,s.z),tail=worldToScreen(s.x-s.vx*.04,s.y-s.vy*.04,s.z);ctx.strokeStyle="#ffe98d";ctx.lineWidth=3*DPR;ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.save();ctx.translate(p.x,p.y);ctx.rotate(s.rot);ctx.fillStyle="#f28a32";ctx.beginPath();ctx.moveTo(15*DPR,0);ctx.lineTo(-10*DPR,-7*DPR);ctx.lineTo(-10*DPR,7*DPR);ctx.closePath();ctx.fill();ctx.fillStyle="#6cab4d";ctx.fillRect(-14*DPR,-7*DPR,6*DPR,14*DPR);ctx.restore();}
function draw(){ctx.setTransform(1,0,0,1,0,0);drawGround();for(const d of decal){const p=worldToScreen(d.x,d.y,0),q=1-d.life/d.max,r=(d.r+(d.maxR-d.r)*q)*p.s;ctx.globalAlpha=d.life/d.max;ctx.strokeStyle=d.color;ctx.lineWidth=5*DPR;ctx.beginPath();ctx.ellipse(p.x,p.y,r,r*.28,0,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
  const renderables=[...actors.map(e=>({y:e.y,fn:()=>drawSprite(e,e.type,e.size,e.type==="mantis"?1:4)})),{y:player.y,fn:drawPlayer}].sort((a,b)=>a.y-b.y);for(const r of renderables)r.fn();for(const s of shots)drawShot(s);
  for(const p0 of particles){const p=worldToScreen(p0.x,p0.y,Math.max(0,p0.z));ctx.globalAlpha=clamp(p0.life/p0.max,0,1);ctx.fillStyle=p0.color;const sz=Math.max(2,p0.r*p.s);ctx.fillRect(p.x-sz/2,p.y-sz/2,sz,sz);ctx.globalAlpha=1;}for(const t of texts){const p=worldToScreen(t.x,t.y,t.z);ctx.font=`900 ${18*DPR}px system-ui`;ctx.textAlign="center";ctx.strokeStyle="#3b3021";ctx.lineWidth=4*DPR;ctx.strokeText(t.text,p.x,p.y);ctx.fillStyle=t.red?"#ff7b68":"#fff0a0";ctx.fillText(t.text,p.x,p.y);}
  if(flash){ctx.fillStyle=`rgba(255,245,185,${flash})`;ctx.fillRect(0,0,W,H);}drawVignette();}
function drawVignette(){const g=ctx.createRadialGradient(W*.5,H*.48,Math.min(W,H)*.25,W*.5,H*.5,Math.max(W,H)*.7);g.addColorStop(0,"rgba(255,238,160,0)");g.addColorStop(1,"rgba(18,37,22,.43)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;if(freeze>0){freeze-=dt;dt=0;}else update(dt);flash=Math.max(0,flash-.9*Math.max(dt,.016));shake=Math.max(0,shake-24*Math.max(dt,.016));if(shake){view.impactX+=(Math.random()-.5)*shake*DPR;view.impactY+=(Math.random()-.5)*shake*.6*DPR;}draw();fpsFrames++;fpsClock+=Math.max(dt,.001);if(fpsClock>.5){fps=Math.round(fpsFrames/fpsClock);fpsFrames=0;fpsClock=0;statsEl.innerHTML=`FPS ${fps}<br>敌人 ${actors.length} · 粒子 ${particles.length}<br>击败 ${kills} · 尖叫 ${player.skill?player.skill.toFixed(1):"READY"}`;}requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if(e.code==="Space"){e.preventDefault();scream();}if(e.key.toLowerCase()==="b"&&!bossSpawned){bossSpawned=true;spawn("mantis",player.x+390,player.y-250);bossText.textContent="⚠ 巨型螳螂：近战技能循环";}if(e.key.toLowerCase()==="r")reset();});addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
const stick=document.querySelector("#stick"),knob=stick.querySelector(".knob"),stickVector={x:0,y:0};let stickId=null;function moveStick(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),m=Math.min(36,l),nx=l?x/l:0,ny=l?y/l:0;stickVector.x=nx*Math.min(1,l/35);stickVector.y=ny*Math.min(1,l/35);knob.style.transform=`translate(${nx*m}px,${ny*m}px)`;}stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)moveStick(e)};stick.onpointerup=stick.onpointercancel=e=>{if(e.pointerId===stickId){stickId=null;stickVector.x=stickVector.y=0;knob.style.transform="";}};document.querySelector("#action").onpointerdown=e=>{e.preventDefault();scream();};
</script>
